{% if video %}
<div class="video-embed">
  <iframe
    src="{{ video.embed_url }}"
    title="Neuhen AI video"
    loading="lazy"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen>
  </iframe>
</div>
<a class="video-link" href="{{ video.watch_url }}" target="_blank" rel="noopener noreferrer">
  Open video on YouTube ↗
</a>
{% else %}
<p class="form-error">This video link is not a valid YouTube URL yet.</p>
{% endif %}
