<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Neuhen AI client acquisition service." />
    <title>{% block title %}Neuhen AI{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <script src="{{ url_for('static', filename='background.js') }}" defer></script>
  </head>
  <body>
    <canvas id="ambient-background" aria-hidden="true"></canvas>
    <header class="site-header">
      <div class="header-left">
        <a class="brand" href="{{ url_for('index') }}">Neuhen AI</a>
        {% if step == 2 %}
        <a class="back-link" href="{{ url_for('index') }}">← Go back</a>
        {% elif step == 3 %}
        <a class="back-link" href="{{ url_for('registration') }}">← Go back</a>
        {% elif step == 4 %}
        <a class="back-link" href="{{ url_for('book') }}">← Go back</a>
        {% endif %}
      </div>
      {% if step %}
      <p class="step-indicator">Step {{ step }} of 4</p>
      {% endif %}
    </header>

    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <a href="{{ url_for('terms') }}">Terms</a>
      <a href="{{ url_for('privacy') }}">Privacy</a>
    </footer>
  </body>
</html>
